<app-header></app-header>

@if (isAuthChecked) {
@if (!userData) {
<app-common-messege heading="Manage Your Account"
    message="Log in to view your personal details, track your orders, and manage your addresses."
    buttonText="Login to View Profile" buttonLink="/login" iconClass="fa-user-circle">
</app-common-messege>
}
@else {
<main class="profile">
    <div class="profile__container">
        <app-profile-menu></app-profile-menu>

        <section class="profile__content">
            <div class="profile__header">
                <h1>Personal Profile</h1>
                <button class="btn-edit" *ngIf="!isEdit" (click)="enableEdit()">
                    <i class="fa fa-pencil"></i> Edit Profile
                </button>
            </div>
            <form class="profile__card" [formGroup]="form">
                <div class="form-grid">
                    <div class="form-group">
                        <label>First Name</label>
                        <input formControlName="firstName" [readonly]="!isEdit" [class.is-editing]="isEdit" />
                    </div>

                    <div class="form-group">
                        <label>Last Name</label>
                        <input formControlName="lastName" [readonly]="!isEdit" [class.is-editing]="isEdit" />
                    </div>

                    <!-- GENDER DROPDOWN -->
                    <div class="form-group">
                        <label>Gender</label>
                        <select formControlName="gender" [class.is-editing]="isEdit" [class.read-only-select]="!isEdit">
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Date of Birth</label>
                        <input type="date" formControlName="dob" [readonly]="!isEdit" [class.is-editing]="isEdit" />
                    </div>

                    <!-- LOCKED FIELDS: Now they only show the lock icon and grey color when in Edit Mode -->
                    <div class="form-group locked-group" [class.is-edit-mode]="isEdit">
                        <label>Mobile Number <i class="fa fa-lock" *ngIf="isEdit" title="Cannot be changed"></i></label>
                        <input formControlName="phone" readonly />
                    </div>

                    <div class="form-group locked-group" [class.is-edit-mode]="isEdit">
                        <label>Email Address <i class="fa fa-lock" *ngIf="isEdit" title="Cannot be changed"></i></label>
                        <input formControlName="email" readonly />
                    </div>

                    <div class="form-group">
                        <label>Location</label>
                        <input formControlName="location" [readonly]="!isEdit" [class.is-editing]="isEdit" />
                    </div>

                    <div class="form-group">
                        <label>Pincode</label>
                        <input formControlName="pinCode" [readonly]="!isEdit" [class.is-editing]="isEdit" />
                    </div>
                </div>

                <!-- Action Buttons with fade-in animation -->
                <div class="profile__actions" *ngIf="isEdit">
                    <button type="button" class="btn-primary" (click)="save()">
                        <i class="fa fa-check"></i> Save Changes
                    </button>
                    <button type="button" class="btn-secondary" (click)="cancel()">
                        Cancel
                    </button>
                </div>
            </form>
        </section>
    </div>
</main>
}
}

<app-footer></app-footer>
