<section class="collection-header">
    <div class="collection-header__content">
        <nav class="breadcrumb">
            <ng-container *ngFor="let crumb of breadcrumbs; let last = last">
                <!-- Drop queryParams so clicking a breadcrumb removes old filters -->
                <a [routerLink]="crumb.slug === '/' ? ['/'] : ['/', crumb.slug]" [queryParams]="{}">{{ crumb.name }}</a>
                <span *ngIf="!last">/</span>
            </ng-container>
        </nav>
        <div class="collection-meta">
            <span class="product-count">{{ totalCount }} Products</span>

            <div class="sort-dropdown" (mouseleave)="isSortOpen = false">
                <button class="sort-btn" (click)="toggleSort()" [class.active]="isSortOpen">
                    Sort by : <strong>{{ selectedSortTitle }}</strong>
                    <i class="fa fa-angle-down" [class.rotated]="isSortOpen"></i>
                </button>

                <ul class="sort-menu" *ngIf="isSortOpen">
                    <li *ngFor="let option of sortOptions" [class.selected]="option.title === selectedSortTitle"
                        (click)="selectSortOption(option)">
                        {{ option.title }}
                    </li>
                </ul>
            </div>
        </div>
    </div>
</section>

<section class="catalog-layout">
    <div class="mobile-filter-bar">
        <button class="mobile-filter-btn" (click)="isFilterOpen = true">
            <i class="fa fa-sliders"></i><span>Filters</span>
        </button>
    </div>

    <aside class="filters-sidebar" [class.active]="isFilterOpen">
        <div class="filters-top">
            <h2>Filters</h2>
            <button class="mobile-close-filter" (click)="isFilterOpen = false">
                <i class="fa fa-times"></i>
            </button>
            <button class="clear-btn">Clear All</button>
        </div>

        <!-- CATEGORY -->
        <section class="filter-group" *ngIf="categories.length > 0">
            <button class="filter-title" (click)="toggleFilter('category')">
                <span>Category</span>
                <i class="fa" [ngClass]="filterStates['category'] ? 'fa-angle-up' : 'fa-angle-down'"></i>
            </button>
            <div class="filter-options" *ngIf="filterStates['category']">
                <label class="filter-option" *ngFor="let item of categories">
                    <div class="checkbox-wrapper">
                        <input type="checkbox" [name]="'cat_' + item.id" [(ngModel)]="item.selected"
                            (ngModelChange)="onFilterUpdate()">
                        <span class="checkmark"></span>
                    </div>
                    <span class="label">{{ item.name }} </span>
                    <small>{{ item.count }}</small>
                </label>
            </div>
        </section>

        <!-- BRAND -->
        <section class="filter-group" *ngIf="brands.length > 0">
            <button class="filter-title" (click)="toggleFilter('brand')">
                <span>Brand</span>
                <i class="fa" [ngClass]="filterStates['brand'] ? 'fa-angle-up' : 'fa-angle-down'"></i>
            </button>
            <div class="filter-options" *ngIf="filterStates['brand']">
                <label class="filter-option" *ngFor="let item of brands">
                    <div class="checkbox-wrapper">
                        <input type="checkbox" [name]="'brand_' + item.id" [(ngModel)]="item.selected"
                            (ngModelChange)="onFilterUpdate()">
                        <span class="checkmark"></span>
                    </div>
                    <span class="label">{{ item.name }}</span>
                    <small>{{ item.count }}</small>
                </label>
            </div>
        </section>

        <!-- GENDER -->
        <section class="filter-group" *ngIf="genders.length > 0">
            <button class="filter-title" (click)="toggleFilter('gender')">
                <span>Gender</span>
                <i class="fa" [ngClass]="filterStates['gender'] ? 'fa-angle-up' : 'fa-angle-down'"></i>
            </button>
            <div class="filter-options" *ngIf="filterStates['gender']">
                <label class="filter-option" *ngFor="let item of genders; let i = index">
                    <div class="checkbox-wrapper">
                        <input type="checkbox" [name]="'gender_' + i" [(ngModel)]="item.selected"
                            (ngModelChange)="onFilterUpdate()">
                        <span class="checkmark"></span>
                    </div>
                    <span class="label">{{ item.name }}</span>
                    <small>{{ item.count }}</small>
                </label>
            </div>
        </section>

        <!-- COLOR -->
        <section class="filter-group" *ngIf="colors.length > 0">
            <button class="filter-title" (click)="toggleFilter('color')">
                <span>Color</span>
                <i class="fa" [ngClass]="filterStates['color'] ? 'fa-angle-up' : 'fa-angle-down'"></i>
            </button>
            <div class="filter-options" *ngIf="filterStates['color']">
                <label class="filter-option" *ngFor="let item of colors">
                    <div class="checkbox-wrapper">
                        <input type="checkbox" [name]="'color_' + item.name" [(ngModel)]="item.selected"
                            (ngModelChange)="onFilterUpdate()">
                        <span class="checkmark"></span>
                    </div>
                    <span class="color-dot" [style.background]="item.code || item.name"></span>
                    <span class="label">{{ item.name }}</span>
                    <small>{{ item.count }}</small>
                </label>
            </div>
        </section>

        <!-- SIZE -->
        <section class="filter-group" *ngIf="sizes.length > 0">
            <button class="filter-title" (click)="toggleFilter('size')">
                <span>Size</span>
                <i class="fa" [ngClass]="filterStates['size'] ? 'fa-angle-up' : 'fa-angle-down'"></i>
            </button>
            <div class="sizes-grid" *ngIf="filterStates['size']">
                <button *ngFor="let size of sizes" [class.active]="size.selected" (click)="toggleSize(size)">
                    {{ size.name }}
                </button>
            </div>
        </section>

        <!-- PRICE RANGE -->
        <section class="filter-group">
            <button class="filter-title" (click)="toggleFilter('price')">
                <span>Price Range</span>
                <i class="fa" [ngClass]="filterStates['price'] ? 'fa-angle-up' : 'fa-angle-down'"></i>
            </button>
            <div *ngIf="filterStates['price']">
                <div class="price-slider">
                    <div class="slider-track"></div>
                    <div class="slider-range" [style.left.%]="(minPrice / maxRange) * 100"
                        [style.right.%]="100 - ((maxPrice / maxRange) * 100)"></div>
                    <input type="range" min="0" [max]="maxRange" [(ngModel)]="minPrice" (change)="onMinPriceChange()">
                    <input type="range" min="0" [max]="maxRange" [(ngModel)]="maxPrice" (change)="onMaxPriceChange()">
                </div>
                <div class="price-values">
                    <span>₹{{ minPrice }}</span>
                    <span>₹{{ maxPrice }}</span>
                </div>
            </div>
        </section>

        <!-- CUSTOMER RATING -->
        <section class="filter-group" *ngIf="ratings.length > 0">
            <button class="filter-title" (click)="toggleFilter('rating')">
                <span>Customer Rating</span>
                <i class="fa" [ngClass]="filterStates['rating'] ? 'fa-angle-up' : 'fa-angle-down'"></i>
            </button>
            <div class="filter-options" *ngIf="filterStates['rating']">
                <label class="filter-option" *ngFor="let item of ratings; let i = index">
                    <div class="checkbox-wrapper">
                        <input type="checkbox" [name]="'rating_' + i" [(ngModel)]="item.selected"
                            (ngModelChange)="onFilterUpdate()">
                        <span class="checkmark"></span>
                    </div>
                    <div class="rating-stars">
                        <i class="fa fa-star"></i><i class="fa fa-star"></i><i class="fa fa-star"></i><i
                            class="fa fa-star"></i>
                    </div>
                    <span class="label">{{ item.name }}</span>
                </label>
            </div>
        </section>

        <!-- DISCOUNT -->
        <section class="filter-group" *ngIf="discounts.length > 0">
            <button class="filter-title" (click)="toggleFilter('discount')">
                <span>Discount</span>
                <i class="fa" [ngClass]="filterStates['discount'] ? 'fa-angle-up' : 'fa-angle-down'"></i>
            </button>
            <div class="filter-options" *ngIf="filterStates['discount']">
                <label class="radio-option" *ngFor="let item of discounts">
                    <input type="radio" name="discount" [value]="item.value" [(ngModel)]="selectedDiscount"
                        (ngModelChange)="onDiscountChange()">
                    <span class="radio-circle"></span>
                    <span class="label">{{ item.label }}</span>
                </label>
            </div>
        </section>
    </aside>

    <div class="filter-overlay" [class.active]="isFilterOpen" (click)="isFilterOpen = false"></div>

    <div class="grid-container">
        <app-common-product-grid [products]="products" customClass="product-list-grid"></app-common-product-grid>

        <div class="custom-pagination" *ngIf="totalPages > 0">
            <div class="pagination-controls">
                <button class="pagination-btn text-btn" [disabled]="currentPage === 1"
                    (click)="changePage(currentPage - 1)">
                    PREVIOUS
                </button>
                <button class="pagination-btn" *ngFor="let page of visiblePages" [class.active]="page === currentPage"
                    (click)="changePage(page)">
                    {{ page }}
                </button>
                <button class="pagination-btn text-btn" [disabled]="currentPage === totalPages"
                    (click)="changePage(currentPage + 1)">
                    NEXT
                </button>
            </div>
            <div class="pagination-info">
                Page {{ currentPage }} of {{ totalPages }}
            </div>
        </div>
    </div>
</section>
