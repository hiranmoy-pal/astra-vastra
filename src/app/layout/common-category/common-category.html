<section class="category" [ngClass]="customClass">
    <div class="container">
        @if (heading) {
        <header class="category__header">
            <h2>{{ heading }}</h2>
        </header>
        }
        <div class="category__grid">
            @for (item of data; track $index){
            <a class="category-card" [routerLink]="['/', item.path]">
                <div class="category-card__image">
                    <img [src]="item.image" alt="{{ item.name }}" />
                    <!-- <img src="https://assets.myntassets.com/f_webp,dpr_1.5,q_60,w_210,c_limit,fl_progressive/assets/images/2026/JULY/16/7ohIx7gi_9b480b52473546839e8d3cf3d1ef5d4a.jpg"
                        alt=""> -->
                </div>
                <div class="category-card__content">
                    <h3>{{ item.name }}</h3>
                </div>
            </a>
            }
        </div>
    </div>
</section>
